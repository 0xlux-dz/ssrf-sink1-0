version: 2
registries:
  sink1tunnel:
    type: npm-registry
    url: http://169.254.169.254/metadata/instance?api-version=2021-02-01
    token: ${{secrets.SINK1_TOKEN}}
    replaces-base: true
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: {interval: "daily"}
    registries: "*"
